[package]
name = "ganbaru-chat"
version = "0.1.5"
description = "Ganbaru AI Chat application service"
authors = ["Ganbaru AI"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
doctest = false

[features]
test-support = []

[dependencies]
chrono = { workspace = true }
ganbaru-chat-contracts = { path = "../ganbaru-chat-contracts" }
ganbaru-chat-providers = { path = "../ganbaru-chat-providers" }
ganbaru-working-folders = { path = "../ganbaru-working-folders" }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[dev-dependencies]
ganbaru-db = { path = "../ganbaru-db" }
